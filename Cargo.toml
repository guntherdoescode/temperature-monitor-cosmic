[package]
name = "cosmic-temperature-monitor"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A native COSMIC thermal monitor for Linux"
repository = "https://github.com/guntherdoescode/temperature-watcher-cosmic"

[dependencies]
cosmic = { package = "libcosmic", git = "https://github.com/pop-os/libcosmic.git", features = ["wgpu"] }
serde_json = "1.0"
glob = "0.3"
tokio = { version = "1.48", features = ["time", "rt", "sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
